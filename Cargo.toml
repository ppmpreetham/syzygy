[package]
name = "project"
description = "A better burp suite tool"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = {version = "0.7" }
rust-embed = "8"
anyhow = "1"
zopra = { version = "*", features = ["wry"] }
strum = "0.28.0"
strum_macros = "0.28.0"
http-mitm-proxy = "0.18.0"

tokio = "1.53.1"
rcgen = {version="0.14.10", features = ["pem", "x509-parser"]}
directories = "6.0.0"

wry = { version = "0.53.5" }
url = "2.5.8"
indexmap = "2.14.2"
http-body-util = "0.1.5"
fjall = "3.1.12"

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.53.5" }

# dev profile optimized for fast compilation
[profile.dev]
opt-level = 0 # no optimizations in dev mode
debug = true # full debug symbols
panic = "unwind" # allows stack unwinding

# release profile optimized for performance

[profile.release.package."*"]
opt-level = 3 # External crates run at full speed so your app isn't sluggish

[profile.release]
opt-level = 3 # max runtime optimization
codegen-units = 1 # no parallel blocks (better for performance)
lto = "fat" # LTO across all crates
panic = "abort" # Removes unwinding code
strip = true # strips debug symbols to slim down the binary
debug = false # no debug symbols in release


[patch.crates-io]
zopra-gpui-view = { path = "../gpui-rsx" }


zopra = { path = "../zopra" }
zopra_macros = { path = "../zopra/zopra_macros" }

[lints.rust]
unused = "warn"
absolute_paths = "warn"

[lints.clippy]
perf = "warn"
complexity = "warn"
